name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  neoforge:
    name: NeoForge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.20.4', neo: '20.4.251', pmc: '1.20.4', pmap: '2024.04.14', toml: 'legacy', java: '17' }
          - { mc: '1.20.5', neo: '20.5.21-beta', pmc: '1.20.4', pmap: '2024.04.14', toml: 'legacy', java: '21' }
          - { mc: '1.20.6', neo: '20.6.141', pmc: '1.20.6', pmap: '2024.06.16', toml: 'legacy', java: '21' }
          - { mc: '1.21', neo: '21.0.167', pmc: '1.21', pmap: '2024.11.10', toml: 'legacy', java: '21' }
          - { mc: '1.21.1', neo: '21.1.257', pmc: '1.21.1', pmap: '2024.11.17', toml: 'legacy', java: '21' }
          - { mc: '1.21.2', neo: '21.2.1-beta', pmc: '1.21.1', pmap: '2024.11.17', toml: 'legacy', java: '21' }
          - { mc: '1.21.3', neo: '21.3.97', pmc: '1.21.3', pmap: '2024.12.07', toml: 'legacy', java: '21' }
          - { mc: '1.21.4', neo: '21.4.158', pmc: '1.21.4', pmap: '2025.03.23', toml: 'legacy', java: '21' }
          - { mc: '1.21.5', neo: '21.5.98', pmc: '1.21.5', pmap: '2025.06.15', toml: 'modern', java: '21' }
          - { mc: '1.21.6', neo: '21.6.20-beta', pmc: '1.21.6', pmap: '2025.06.29', toml: 'modern', java: '21' }
          - { mc: '1.21.7', neo: '21.7.25-beta', pmc: '1.21.7', pmap: '2025.07.18', toml: 'modern', java: '21' }
          - { mc: '1.21.8', neo: '21.8.54', pmc: '1.21.8', pmap: '2025.09.14', toml: 'modern', java: '21' }
          - { mc: '1.21.9', neo: '21.9.16-beta', pmc: '1.21.9', pmap: '2025.10.05', toml: 'modern', java: '21' }
          - { mc: '1.21.10', neo: '21.10.64', pmc: '1.21.10', pmap: '2025.10.12', toml: 'modern', java: '21' }
          - { mc: '1.21.11', neo: '21.11.45', pmc: '1.21.11', pmap: '2025.12.20', toml: 'modern', java: '21', cmdperm: 'modern' }
          - { mc: '26.1', neo: '26.1.0.19-beta', pmc: '', pmap: '', toml: 'modern', java: '25', cmdperm: 'modern' }
          - { mc: '26.1.1', neo: '26.1.1.15-beta', pmc: '', pmap: '', toml: 'modern', java: '25', cmdperm: 'modern' }
          - { mc: '26.1.2', neo: '26.1.2.114', pmc: '', pmap: '', toml: 'modern', java: '25', cmdperm: 'modern' }
          - { mc: '26.2', neo: '26.2.0.88', pmc: '', pmap: '', toml: 'modern', java: '25', cmdperm: 'modern' }
          - { mc: '26.3', neo: '26.3.0.52-beta', pmc: '', pmap: '', toml: 'modern', java: '25', cmdperm: 'modern' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: neoforge

      - name: Build with Gradle
        run: >
          ./gradlew build
          -Pminecraft_version='${{ matrix.mc }}'
          -Pminecraft_version_range='[${{ matrix.mc }}]'
          -Pneo_version='${{ matrix.neo }}'
          -Pparchment_minecraft_version='${{ matrix.pmc }}'
          -Pparchment_mappings_version='${{ matrix.pmap }}'
          -Ptoml_variant='${{ matrix.toml }}'
          -Pjava_version='${{ matrix.java }}'
          -Pcmdperm='${{ matrix.cmdperm }}'
        working-directory: neoforge

      - name: Rename jar
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p ../dist
          mv "build/libs/offlinelan-${VER}.jar" "../dist/offlinelan-neoforge-${{ matrix.mc }}-${VER}.jar"
        working-directory: neoforge

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: offlinelan-neoforge-${{ matrix.mc }}
          path: dist/offlinelan-neoforge-${{ matrix.mc }}-*.jar
          if-no-files-found: error

  forge:
    name: Forge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.19.2', forge: '43.5.0', mcrange: '[1.19.2,1.20)', frange: '[43,)', lrange: '[43,)', pack: '9', cmdperm: 'legacy19' }
          - { mc: '1.19.3', forge: '44.1.0', mcrange: '[1.19.3,1.20)', frange: '[44,)', lrange: '[44,)', pack: '12', cmdperm: 'legacy19' }
          - { mc: '1.19.4', forge: '45.4.0', mcrange: '[1.19.4,1.20)', frange: '[45,)', lrange: '[45,)', pack: '13', cmdperm: 'legacy19' }
          - { mc: '1.20', forge: '46.0.14', mcrange: '[1.20,1.21)', frange: '[46,)', lrange: '[46,)', pack: '15' }
          - { mc: '1.20.1', forge: '47.4.10', mcrange: '[1.20.1,1.21)', frange: '[47,)', lrange: '[47,)', pack: '15' }
          - { mc: '1.20.2', forge: '48.1.0', mcrange: '[1.20.2,1.21)', frange: '[48,)', lrange: '[48,)', pack: '18' }
          - { mc: '1.20.4', forge: '49.2.0', mcrange: '[1.20.4,1.21)', frange: '[49,)', lrange: '[49,)', pack: '22' }
          - { mc: '1.20.6', forge: '50.2.0', mcrange: '[1.20.6,1.21)', frange: '[50,)', lrange: '[50,)', pack: '32', java: '21' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: forge

      - name: Build with Gradle
        run: >
          ./gradlew build
          -Pminecraft_version='${{ matrix.mc }}'
          -Pminecraft_version_range='${{ matrix.mcrange }}'
          -Pforge_version='${{ matrix.forge }}'
          -Pforge_version_range='${{ matrix.frange }}'
          -Ploader_version_range='${{ matrix.lrange }}'
          -Pmapping_version='${{ matrix.mc }}'
          -Ppack_format='${{ matrix.pack }}'
          -Pcmdperm='${{ matrix.cmdperm }}'
          -Pjava_version='${{ matrix.java }}'
        working-directory: forge

      - name: Rename jar
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p ../dist
          mv "build/libs/offlinelan-${VER}.jar" "../dist/offlinelan-forge-${{ matrix.mc }}-${VER}.jar"
        working-directory: forge

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: offlinelan-forge-${{ matrix.mc }}
          path: dist/offlinelan-forge-${{ matrix.mc }}-*.jar
          if-no-files-found: error

  fabric:
    name: Fabric ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.20', api: '0.83.0+1.20' }
          - { mc: '1.20.1', api: '0.92.12+1.20.1' }
          - { mc: '1.20.2', api: '0.91.6+1.20.2' }
          - { mc: '1.20.3', api: '0.91.1+1.20.3' }
          - { mc: '1.20.4', api: '0.97.3+1.20.4' }
          - { mc: '1.20.5', api: '0.97.8+1.20.5' }
          - { mc: '1.20.6', api: '0.100.8+1.20.6' }
          - { mc: '1.21', api: '0.102.0+1.21' }
          - { mc: '1.21.1', api: '0.116.17+1.21.1' }
          - { mc: '1.21.2', api: '0.106.1+1.21.2' }
          - { mc: '1.21.3', api: '0.114.1+1.21.3' }
          - { mc: '1.21.4', api: '0.119.4+1.21.4' }
          - { mc: '1.21.5', api: '0.128.2+1.21.5' }
          - { mc: '1.21.6', api: '0.128.2+1.21.6' }
          - { mc: '1.21.7', api: '0.129.0+1.21.7' }
          - { mc: '1.21.8', api: '0.136.1+1.21.8' }
          - { mc: '1.21.9', api: '0.134.1+1.21.9' }
          - { mc: '1.21.10', api: '0.138.4+1.21.10' }
          - { mc: '1.21.11', api: '0.141.6+1.21.11', cmdperm: 'modern' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: fabric

      - name: Resolve per-version properties
        id: props
        run: |
          case '${{ matrix.mc }}' in
            1.20|1.20.1|1.20.2|1.20.3|1.20.4) JR=17; JD='>=17' ;;
            *) JR=21; JD='>=21' ;;
          esac
          echo "java_release=$JR" >> "$GITHUB_OUTPUT"
          echo "java_dep=$JD" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: >
          ./gradlew build
          -Pminecraft_version='${{ matrix.mc }}'
          -Pfabric_api_version='${{ matrix.api }}'
          -Pjava_release='${{ steps.props.outputs.java_release }}'
          -Pminecraft_dep='~${{ matrix.mc }}'
          -Pjava_dep='${{ steps.props.outputs.java_dep }}'
          -Pcmdperm='${{ matrix.cmdperm }}'
        working-directory: fabric

      - name: Rename jar
        run: |
          VER=$(grep '^version=' gradle.properties | cut -d= -f2)
          mkdir -p ../dist
          mv "build/libs/offlinelan-${VER}.jar" "../dist/offlinelan-fabric-${{ matrix.mc }}-${VER}.jar"
        working-directory: fabric

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: offlinelan-fabric-${{ matrix.mc }}
          path: dist/offlinelan-fabric-${{ matrix.mc }}-*.jar
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [neoforge, forge, fabric]
    steps:
      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          pattern: offlinelan-*
          merge-multiple: true
          path: dist

      - name: List jars
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
